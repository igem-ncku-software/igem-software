# Dose-response experiment design & thresholds.
# Single source of truth for the plate map and tunable thresholds, read by
# io.py/normalize.py/timeseries.py/doseresponse.py. Changing plate layout or
# thresholds only requires editing this file.

fluorescence:
  ex_nm: 485
  em_nm: 510

read_interval_h: 1.0

# AHL (3-oxo-C12-HSL) concentration per plate row, in Molar.
concentrations_M:
  A: 0.0
  B: 1.0e-9
  C: 1.0e-8
  D: 1.0e-7
  E: 1.0e-6
  F: 1.0e-5

# Strain -> plate columns (design v.1).
# Key spelled with the Unicode alpha (DH5α) to match the tidy table's
# `strain` column values exactly (TOP10 / DH5α / BL21). Using the same
# spelling here as in the data avoids a separate ASCII<->display
# translation layer.
strains:
  TOP10: [1, 2, 3]
  DH5α: [4, 5, 6]
  BL21: [7, 8, 9]

roles:
  blank_row: G
  positive_wells: [H1, H2, H3]

thresholds:
  od_min: 0.02
  onset_k_sd: 3
  cv_max: 0.20
  growth_inhibition_frac: 0.20

hill:
  n_bounds: [0.5, 4.0]
