<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AHL Dose-Response Analysis · iGEM NCKU Software</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="back-link" href="index.html">&larr; Back to overview</a>
      <p class="eyebrow">iGEM NCKU SOFTWARE</p>
      <h1>AHL Dose-Response Analysis</h1>
      <p class="subtitle">EC50, Hill slope, and detection limits per strain</p>
    </header>

    <main>
      <section class="card">
        <p class="section-label">Analysis</p>

        <p class="section-description">
          Upload a raw plate reader export
        </p>

        <form id="dose-response-form">
          <label for="dose-response-file">Plate reader export file</label>
          <input type="file" id="dose-response-file" accept=".txt" />

          <button type="submit" id="analyze-button">Upload &amp; Analyze</button>
        </form>

        <p class="status-message" id="dose-response-status"></p>

        <div class="result-block" id="dose-response-result" hidden>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Strain</th>
                  <th>EC50 (nM)</th>
                  <th>95% CI (nM)</th>
                  <th>Hill n</th>
                  <th>R&sup2;</th>
                  <th>Responsive</th>
                  <th>LOD (nM)</th>
                  <th>LOQ (nM)</th>
                </tr>
              </thead>
              <tbody id="results-table-body"></tbody>
            </table>
          </div>

          <div id="strain-charts"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Backend: <span id="backend-status" class="backend-status-badge">Checking...</span></p>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/dose_response.js"></script>
  <script src="js/backend_status.js"></script>
</body>
</html>
