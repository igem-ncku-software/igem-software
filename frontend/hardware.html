<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GY-302 Light Sensor · iGEM NCKU Software</title>
  <meta name="description" content="Live illuminance readings from the GY-302 light sensor on the ESP32 module." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />
  <link rel="apple-touch-icon" href="assets/images/logo-mark.png" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="back-link" href="index.html">&larr; Back to overview</a>
      <img class="site-logo" src="assets/images/logo-wordmark.png"
           alt="iGEM NCKU-Tainan 2026 Capture" width="960" height="513" />
      <p class="eyebrow">iGEM NCKU SOFTWARE</p>
      <h1>GY-302 Light Sensor</h1>
      <p class="subtitle">Live illuminance readings from the ESP32 module</p>
    </header>

    <main>
      <section class="card">
        <div class="section-heading">
          <p class="section-label">Live Data</p>
          <span id="gy302-live-badge" class="backend-status-badge offline">Offline</span>
        </div>

        <p class="section-description">
          Illuminance (lux) from the GY-302 module
        </p>

        <!-- .chart-plate is an opaque surface: the card behind it is frosted
             glass, and a line plot over a blurred backdrop is unreadable.
             No height attribute on the canvas: Chart.js ignores its aspectRatio
             option when the canvas carries an explicit height. See
             js/hardware_gy302.js. -->
        <div class="chart-plate">
          <canvas id="gy302-chart"></canvas>
        </div>

        <div class="sensor-stats">
          <div class="sensor-stat">
            <span class="sensor-stat-label">Lux</span>
            <span class="sensor-stat-value" id="gy302-lux-value">--</span>
          </div>
        </div>

        <p class="status-message" id="gy302-latest-time"></p>
      </section>
    </main>

    <footer class="site-footer">
      <p>Backend: <span id="backend-status" class="backend-status-badge">Checking...</span></p>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/hardware_gy302.js"></script>
  <script src="js/backend_status.js"></script>
</body>
</html>
